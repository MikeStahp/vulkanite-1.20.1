plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/vulkanite.accesswidener")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}


configurations.all {
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion '3.3.1'
            }
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation(fabricApi.module("fabric-rendering-fluids-v1", project.fabric_version))
    modImplementation(fabricApi.module("fabric-key-binding-api-v1", project.fabric_version))
    modImplementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))
    modImplementation(fabricApi.module("fabric-api-base", project.fabric_version))
    modImplementation(fabricApi.module("fabric-block-view-api-v2", project.fabric_version))
    modImplementation(fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version))
    modImplementation("net.fabricmc.fabric-api:fabric-rendering-data-attachment-v1:0.3.38+73761d2e9a")
    modImplementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))

    modImplementation "maven.modrinth:sodium:mc1.20.1-0.5.11"
    modImplementation "maven.modrinth:iris:1.7.5+1.20.1"

    modRuntimeOnly 'org.anarres:jcpp:1.4.14'
    modRuntimeOnly 'io.github.douira:glsl-transformer:2.0.0-pre13'

    modRuntimeOnly 'net.java.dev.jna:jna:5.9.0'
    implementation 'net.java.dev.jna:jna:5.9.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Minecraft's mapped classes require Loader's access and Mixin transforms.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

tasks.named('test') {
    useJUnitPlatform()
    // Loader/Mixin initialization can emit config and logs; keep them with
    // generated test output instead of in the checkout or the game directory.
    workingDir = layout.buildDirectory.dir("test-runtime").get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

tasks.withType(JavaExec).configureEach {
    def customJavaHome = providers.gradleProperty("vulkanite.java.home")
            .orElse(providers.environmentVariable("VULKANITE_JAVA_HOME"))
    if (customJavaHome.present) {
        def javaExecutable = System.getProperty("os.name").toLowerCase().contains("win")
                ? "bin/java.exe"
                : "bin/java"
        executable = layout.projectDirectory.file("${customJavaHome.get()}/${javaExecutable}").asFile.absolutePath
    } else {
        javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
    }
    jvmArgs "-Dorg.lwjgl.system.stackSize=8192", "-Xmx7G",
            "--add-opens=java.base/java.nio=ALL-UNNAMED",
            "--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED",
            "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
            "--add-opens=java.base/java.lang=ALL-UNNAMED",
            "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
            "--add-opens=java.base/java.util=ALL-UNNAMED"
    // Forward explicit development selections to the launched JVM. Defaults and
    // feature dependencies belong to the runtime configuration, including the
    // default-off hybrid and diagnostic paths.
    project.properties.findAll { key, value -> key.startsWith("vulkanite.") }.each { key, value ->
        systemProperty key, value.toString()
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    archivesBaseName = project.archives_base_name
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.register("syncVulkaniteShaderpacks") {
    group = "vulkanite"
    description = "Copies tracked Vulkanite shaderpacks into the local Iris run directory."

    def packNames = ["VulkaniteRT", "VulkaniteDeferred", "VulkaniteNormal"]
    def sourceDirectories = packNames.collect {
        layout.projectDirectory.dir("shaderpacks/${it}")
    }

    // Shaderpack sources are optional while they still live under the ignored
    // run directory. Do not declare a missing parent directory as a task input.
    inputs.files(provider {
        sourceDirectories.findAll { it.asFile.isDirectory() }.collect { it.asFile }
    })
    packNames.each { packName ->
        outputs.dir(layout.projectDirectory.dir("run/shaderpacks/${packName}"))
    }

    doLast {
        packNames.each { packName ->
            def source = layout.projectDirectory.dir("shaderpacks/${packName}")
            def target = layout.projectDirectory.dir("run/shaderpacks/${packName}")

            if (!source.asFile.isDirectory()) {
                logger.info("Skipping ${packName}: tracked source directory does not exist")
                return
            }

            delete(target)
            copy {
                from(source)
                into(target)
                exclude("**/*.spv")
            }
        }
    }
}

tasks.register("validateVulkaniteShaderpackDrift") {
    group = "vulkanite"
    description = "Fails if runtime Vulkanite shaderpacks differ from tracked sources after sync."
    dependsOn(tasks.named("syncVulkaniteShaderpacks"))

    doLast {
        def packNames = ["VulkaniteRT", "VulkaniteDeferred", "VulkaniteNormal"]
        def normalize = { File file ->
            file.getText("UTF-8").replace("\r\n", "\n").replace("\r", "\n")
        }
        def relativize = { File root, File file ->
            root.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
        }

        def drift = []
        packNames.each { packName ->
            def sourceRoot = layout.projectDirectory.dir("shaderpacks/${packName}").asFile
            if (!sourceRoot.isDirectory()) {
                logger.info("Skipping ${packName}: tracked source directory does not exist")
                return
            }

            def targetRoot = layout.projectDirectory.dir("run/shaderpacks/${packName}").asFile
            if (!targetRoot.isDirectory()) {
                drift.add("${packName}: runtime shaderpack directory is missing")
                return
            }

            def sourceFiles = fileTree(sourceRoot) {
                exclude("**/*.spv")
            }.files.findAll { it.isFile() }.collectEntries { [relativize(sourceRoot, it), it] }
            def targetFiles = fileTree(targetRoot) {
                exclude("**/*.spv")
            }.files.findAll { it.isFile() }.collectEntries { [relativize(targetRoot, it), it] }

            (sourceFiles.keySet() - targetFiles.keySet()).sort().each {
                drift.add("${packName}: missing runtime file ${it}")
            }
            (targetFiles.keySet() - sourceFiles.keySet()).sort().each {
                drift.add("${packName}: extra runtime file ${it}")
            }
            sourceFiles.keySet().intersect(targetFiles.keySet()).sort().each {
                if (normalize(sourceFiles[it]) != normalize(targetFiles[it])) {
                    drift.add("${packName}: content differs for ${it}")
                }
            }
        }

        if (!drift.isEmpty()) {
            throw new GradleException("Runtime shaderpack drift detected:\n - " + drift.join("\n - "))
        }

        logger.lifecycle("Vulkanite shaderpack runtime copies match tracked sources.")
    }
}

tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
    dependsOn(tasks.named("syncVulkaniteShaderpacks"))
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}


import org.gradle.internal.os.OperatingSystem

project.ext.lwjglVersion = "3.3.1"
project.ext.jomlVersion = "1.10.4"

switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        def osArch = System.getProperty("os.arch")
        project.ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64")
                ? "natives-linux-${osArch.contains("64") || osArch.startsWith("armv8") ? "arm64" : "arm32"}"
                : "natives-linux"
        break
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break
}

repositories {
    mavenCentral()
}

dependencies {
    include(implementation("org.joml:joml:${jomlVersion}"))

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    include(implementation("org.lwjgl:lwjgl-meshoptimizer"))
    include(implementation("org.lwjgl:lwjgl-vma"))
    include(implementation("org.lwjgl:lwjgl-shaderc"))
    include(implementation("org.lwjgl:lwjgl-spvc"))

    include(runtimeOnly("org.lwjgl:lwjgl-meshoptimizer:$lwjglVersion:$lwjglNatives"))
    include(runtimeOnly("org.lwjgl:lwjgl-vma:$lwjglVersion:$lwjglNatives"))
    include(runtimeOnly("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$lwjglNatives"))
    include(runtimeOnly("org.lwjgl:lwjgl-spvc:$lwjglVersion:$lwjglNatives"))

    include(implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion"))
    include(implementation("org.lwjgl:lwjgl-meshoptimizer:$lwjglVersion:$lwjglNatives"))
    include(implementation("org.lwjgl:lwjgl-vma:$lwjglVersion:$lwjglNatives"))
    include(implementation("org.lwjgl:lwjgl-shaderc:$lwjglVersion:$lwjglNatives"))
    include(implementation("org.lwjgl:lwjgl-spvc:$lwjglVersion:$lwjglNatives"))

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
}
