# VulkaniteRT Configuration
iris.features.required=SSBO CUSTOM_IMAGES
iris.features.optional=BLOCK_EMISSION_ATTRIBUTE

# Toggles (managed by Vulkanite Java UI)

# Screens

# Uniforms
uniform.vec2.resolution=vec2(viewWidth, viewHeight)

# Formats - DLSSD-compatible (R16G16B16A16_SFLOAT required for all G-buffer inputs)
# DLSSD requires: RGBA16F for color buffers, R32F for depth
# Note: Changing these formats may affect shader compatibility - ensure shaders
# are updated to handle half-precision float inputs
colortex1Format=RGBA16F
colortex2Format=RGBA16F
colortex3Format=RGBA16F
colortex4Format=RGBA32F
colortex5Format=RGBA16F

# Images - Updated to use RGBA16F for DLSSD compatibility
image.reservoirA=reservoirA_Sampler rgba rgba32f float false true 1.0 1.0
image.gbufferAlbedo=gbufferAlbedo_Sampler rgba rgba16f float false true 1.0 1.0
image.gbufferMaterial=gbufferMaterial_Sampler rgba rgba16f float false true 1.0 1.0
image.gbufferNormal=gbufferNormal_Sampler rgba rgba16f float false true 1.0 1.0
image.gbufferWorldPos=gbufferWorldPos_Sampler rgba rgba32f float false true 1.0 1.0
image.gbufferExtra=gbufferExtra_Sampler rgba rgba16f float false true 1.0 1.0
image.blockLightImage=blockLightImage_Sampler rgba rgba32f float false true 1.0 1.0
image.sunLightImage=sunLightImage_Sampler rgba rgba32f float false true 1.0 1.0
image.labpbrImage=labpbrImage_Sampler rgba rgba32f float false true 1.0 1.0
# Motion vectors: RGBA16F for DLSSD (requires 4 channels, .zw = 0)
image.motionVectors=motionVectors_Sampler rgba rgba16f float false true 1.0 1.0

# Buffers
bufferObject.0=210000000
bufferObject.1=256
bufferObject.2=95000000
bufferObject.3=120000000
bufferObject.4=120000000
bufferObject.5=26000000
