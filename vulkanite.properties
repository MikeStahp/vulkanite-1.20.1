# Vulkanite Configuration File
# This file controls various Vulkanite features including ReSTIR and DIRT RT settings

# Enable or disable ReSTIR entirely
enableRestir=true

# Enable or disable DIRT RT (a variant of ReSTIR)
enableDirtRt=true

# Resolution of ReSTIR reservoirs (width x height)
# Higher values provide better quality but use more VRAM
restirReservoirWidth=1920
restirReservoirHeight=1080

# Additional settings can be added here as needed